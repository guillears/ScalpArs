<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCALPARS - Login</title>
    <!-- 🎨 (DECISION_LOG 345) same theme as the dashboard — default dark; 'light' only when picked (localStorage 'scalpars-theme'), set before first paint -->
    <script id="scalpars-theme-early">try { if (localStorage.getItem('scalpars-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1a1a2e',
                        secondary: '#16213e',
                        accent: '#0f3460',
                        success: '#10b981',
                        danger: '#ef4444',
                        warning: '#f59e0b',
                    }
                }
            }
        }
    </script>
    <style>
        html {
            background: #0f0f1a;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
        }
        .glass {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-strong {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .robot {
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.3));
        }
        .fade-in {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        .fade-in-delay-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-in-delay-2 { animation-delay: 0.2s; opacity: 0; }
        .fade-in-delay-3 { animation-delay: 0.3s; opacity: 0; }
        .shake { animation: shake 0.5s ease-in-out; }
        .glow-ring {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            transition: box-shadow 0.3s ease;
        }
        .glow-ring:focus-within {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3);
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
        }
        .grid-bg {
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
    <!-- 🎨 SCALPARS THEME LAYER (DECISION_LOG 345) — look only; :root-prefixed so it outranks the Tailwind CDN utilities. -->
    <style id="scalpars-theme">
        :root {
            --bg: #0e1118; --surface: #151922; --surface-2: #1b2030; --line: #262c3c;
            --fg: #e6e9f0; --muted: #8b94a7; --faint: #646d80;
            --accent: #f0a43c; --accent-soft: #3a2a14; --on-accent: #1a1206;
            --neg: #f26d6d; --neg-soft: #3a1a1c;
            --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .35);
            --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            color-scheme: dark;
        }
        :root[data-theme="light"] {
            --bg: #f3f4f7; --surface: #ffffff; --surface-2: #eceef3; --line: #dcdfe7;
            --fg: #151a26; --muted: #5b6375; --faint: #848b9b;
            --accent: #b86a0e; --accent-soft: #f6e7d2; --on-accent: #ffffff;
            --neg: #bf3236; --neg-soft: #f8e1e1;
            --shadow: 0 1px 2px rgba(20, 26, 40, .06), 0 12px 32px rgba(20, 26, 40, .08);
            color-scheme: light;
        }
        :root, :root body { background: var(--bg); }
        :root body { color: var(--fg); font-family: var(--font-ui); background-image: none; }
        :root .glass-strong { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
        :root h1.bg-clip-text { background: none; color: var(--fg); -webkit-text-fill-color: currentColor; letter-spacing: .14em; font-weight: 700; font-size: 2rem; }
        :root .scalpars-logo-accent { color: var(--accent); }
        :root .robot { filter: none; }
        :root .text-gray-400, :root .text-gray-500 { color: var(--muted); }
        :root .text-gray-600 { color: var(--faint); }
        :root .hover\:text-gray-200:hover { color: var(--fg); }
        :root #password { background: var(--surface-2); border-color: var(--line); color: var(--fg); }
        :root #password::placeholder { color: var(--faint); }
        :root #password:focus { border-color: var(--accent); }
        :root .glow-ring:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
        :root #login-btn { background: var(--accent); background-image: none; color: var(--on-accent); border: 1px solid var(--accent); }
        :root #login-btn:hover { background: color-mix(in srgb, var(--accent) 88%, var(--fg)); }
        :root .btn-glow:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
        :root #error-box { background: var(--neg-soft); border-color: color-mix(in srgb, var(--neg) 45%, var(--line)); color: var(--neg); }
        html.scalpars-theme-switching *, html.scalpars-theme-switching *::before, html.scalpars-theme-switching *::after { transition: none !important; }
        :root :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .scalpars-theme-btn { position: fixed; top: 16px; right: 16px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 16px; line-height: 1; cursor: pointer; z-index: 10; }
        .scalpars-theme-btn:hover { border-color: var(--muted); }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
            .fade-in-delay-1, .fade-in-delay-2, .fade-in-delay-3 { opacity: 1; }
        }
    </style>
</head>
<body class="text-gray-100 font-sans grid-bg flex items-center justify-center px-4">
    <!-- 🎨 (DECISION_LOG 345) light / dark -->
    <button type="button" id="theme-toggle-btn" class="scalpars-theme-btn" onclick="scalparsToggleTheme()" title="Switch light / dark" aria-label="Switch to light mode" aria-pressed="false">☀</button>

    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="glass-strong rounded-2xl p-8 shadow-2xl">

            <!-- Robot + Branding -->
            <div class="text-center mb-8 fade-in fade-in-delay-1">
                <div class="robot text-8xl mb-4 inline-block select-none">🤖</div>
                <h1 class="text-4xl font-extrabold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent tracking-wider">
                    SCALP<span class="scalpars-logo-accent">ARS</span>
                </h1>
                <p class="text-gray-400 text-sm mt-2 tracking-wide">Neural Decision Engine</p>
            </div>

            <!-- Error Message -->
            <div id="error-box" class="hidden mb-4 px-4 py-3 rounded-lg bg-red-500/15 border border-red-500/30 text-red-400 text-sm text-center fade-in">
                <span id="error-msg">Wrong password</span>
            </div>

            <!-- Login Form -->
            <form id="login-form" method="POST" action="/login" class="space-y-5 fade-in fade-in-delay-2">

                <div class="glow-ring rounded-lg">
                    <div class="relative">
                        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                            class="w-full pl-11 pr-11 py-3 rounded-lg bg-white/10 border border-white/15 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500/50 transition-colors"
                        >
                        <button type="button" id="toggle-pw" onclick="togglePassword()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-200 transition-colors focus:outline-none">
                            <svg id="eye-open" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eye-closed" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L6.11 6.11m3.768 3.768l4.242 4.242M6.11 6.11l-3.22-3.22m3.22 3.22l4.242 4.242m0 0L17.89 17.89m0 0l3.22 3.22M17.89 17.89l-4.242-4.242"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    id="login-btn"
                    class="btn-glow w-full py-3 rounded-lg font-semibold text-white bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-400 hover:to-cyan-400 transition-all duration-300 flex items-center justify-center space-x-2"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    <span>Login</span>
                </button>
            </form>

            <!-- Footer -->
            <p class="text-center text-gray-600 text-xs mt-8 fade-in fade-in-delay-3">
                SCALPARS Neural Decision Engine v1.0
            </p>
        </div>
    </div>

    <script id="scalpars-theme-js">
        (function () {
            const root = document.documentElement;
            function paint() {
                const b = document.getElementById('theme-toggle-btn'); if (!b) return;
                const light = root.getAttribute('data-theme') === 'light';
                b.textContent = light ? '☾' : '☀';
                b.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
                b.setAttribute('aria-pressed', light ? 'true' : 'false');
            }
            window.scalparsToggleTheme = function () {
                const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                root.classList.add('scalpars-theme-switching');   // no colour fade while the theme flips
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('scalpars-theme', next); } catch (e) {}
                requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('scalpars-theme-switching')));
                paint();
            };
            paint();
        })();
    </script>
    <script>
        const form = document.getElementById('login-form');
        const errorBox = document.getElementById('error-box');
        const errorMsg = document.getElementById('error-msg');
        const card = form.closest('.glass-strong');
        const passwordInput = document.getElementById('password');

        function togglePassword() {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            document.getElementById('eye-open').classList.toggle('hidden', !isHidden);
            document.getElementById('eye-closed').classList.toggle('hidden', isHidden);
        }

        // JARVIS welcome trigger — flag in sessionStorage, played by dashboard on next load.
        // Form submit counts as user interaction → browser autoplay policy is satisfied
        // when the dashboard plays audio shortly after.
        form.addEventListener('submit', function() {
            try { sessionStorage.setItem('jarvis_play_welcome', '1'); } catch(e) {}
        });

        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            errorBox.classList.remove('hidden');
            card.classList.add('shake');
            passwordInput.focus();
            setTimeout(() => card.classList.remove('shake'), 500);
        } else {
            passwordInput.focus();
        }
    </script>
</body>
</html>
